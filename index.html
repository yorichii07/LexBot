<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexBot - Legal Assistant</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <h1><span class="lex">Lex</span><span class="bot">Bot</span> - <span class="law-finder">Legal Assistant</span></h1>
    </header>
    <div class="chat-container">
        <div class="chat-header">Legal Assistant</div>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Ask about any law...">
            <button id="send-button" type="button">Send ➤</button>
            <button id="micButton" type="button">🎤</button>
        </div>
    </div>
    <footer>
        <div class="footer-sections">
            <div class="footer-section">
                <a href="categories.html">View Law Categories</a>
            </div>
        </div>
        <p class="rights-reserved">© 2025 LexBot. All Rights Reserved.</p>
    </footer>
</body>
</html>
